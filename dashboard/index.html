<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>FlagZero — dashboard stub</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-monospace, Menlo, Consolas, monospace; background:#111; color:#eee; margin:0; padding:1rem; }
  h1 { font-size:1rem; font-weight:600; margin:0 0 .25rem; }
  #status { font-size:.85rem; margin-bottom:1rem; }
  #status.connected { color:#7CFC00; }
  #status.disconnected { color:#ff5555; }
  #log { display:flex; flex-direction:column; gap:.4rem; }
  .msg { border-left:4px solid #555; padding:.4rem .6rem; background:#1b1b1b; white-space:pre-wrap; word-break:break-word; font-size:.8rem; }
  .msg .type { font-weight:700; margin-right:.5rem; }
  .type-incident { border-color:#f5a623; }
  .type-severity_update { border-color:#ff5555; }
  .type-eta_update { border-color:#4aa3ff; }
  .type-monte_carlo_result { border-color:#b57cff; }
  .type-unknown { border-color:#777; }
</style>
</head>
<body>
  <h1>FlagZero — dashboard stub</h1>
  <div id="status" class="disconnected">disconnected</div>
  <div id="log"></div>

  <script>
    // Minimal stub: render whatever arrives on the WebSocket as raw JSON.
    // Swap this file's rendering logic for real flag/vitals UI as the demo
    // takes shape -- the message shapes are documented in
    // shared/ws_messages.md, so the connection code below shouldn't need
    // to change.
    const WS_URL = "ws://localhost:8765";
    const statusEl = document.getElementById("status");
    const logEl = document.getElementById("log");

    function connect() {
      const ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        statusEl.textContent = `connected to ${WS_URL}`;
        statusEl.className = "connected";
      };

      ws.onclose = () => {
        statusEl.textContent = `disconnected — retrying in 2s`;
        statusEl.className = "disconnected";
        setTimeout(connect, 2000);
      };

      ws.onerror = () => ws.close();

      ws.onmessage = (event) => {
        let envelope;
        try {
          envelope = JSON.parse(event.data);
        } catch {
          appendRaw("unknown", event.data);
          return;
        }
        appendRaw(envelope.type || "unknown", JSON.stringify(envelope, null, 2));
      };
    }

    function appendRaw(type, text) {
      const div = document.createElement("div");
      div.className = `msg type-${type}`;
      const label = document.createElement("span");
      label.className = "type";
      label.textContent = type;
      div.appendChild(label);
      div.appendChild(document.createTextNode(text));
      logEl.prepend(div);
      // keep the log from growing forever during a long demo run
      while (logEl.children.length > 200) logEl.removeChild(logEl.lastChild);
    }

    connect();
  </script>
</body>
</html>
